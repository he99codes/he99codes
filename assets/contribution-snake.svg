  <style>
    @keyframes pulseSnakeCard {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(67, 233, 123, 0.25)); }
      50% { filter: drop-shadow(0 0 8px rgba(67, 233, 123, 0.6)); }
    }
    @keyframes snakeMove {
      0% { transform: translate(0, 0); }
      15% { transform: translate(120px, 0); }
      30% { transform: translate(120px, 30px); }
      50% { transform: translate(320px, 30px); }
      70% { transform: translate(320px, 60px); }
      85% { transform: translate(520px, 60px); }
      100% { transform: translate(720px, 60px); }
    }
    @keyframes eatBlock1 {
      0%, 12% { fill: #39d353; opacity: 1; }
      15%, 100% { fill: #00f2fe; opacity: 0.4; transform: scale(0.8); }
    }
    @keyframes eatBlock2 {
      0%, 48% { fill: #26a641; opacity: 1; }
      52%, 100% { fill: #00f2fe; opacity: 0.4; transform: scale(0.8); }
    }
    @keyframes eatBlock3 {
      0%, 82% { fill: #39d353; opacity: 1; }
      86%, 100% { fill: #00f2fe; opacity: 0.4; transform: scale(0.8); }
    }
    .snake-frame { animation: pulseSnakeCard 4s infinite ease-in-out; }
    .snake-head { fill: #00f2fe; filter: drop-shadow(0 0 5px #00f2fe); }
    .snake-body { fill: #38d39f; }
  </style>

