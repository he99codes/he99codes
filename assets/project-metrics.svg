<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.2)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6)); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(255, 88, 88, 0.2)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 0 8px rgba(255, 88, 88, 0.6)); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(67, 233, 123, 0.2)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 0 8px rgba(67, 233, 123, 0.6)); }
    }
    @keyframes float4 {
      0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(254, 225, 64, 0.2)); }
      50% { transform: translateY(-4px); filter: drop-shadow(0 0 8px rgba(254, 225, 64, 0.6)); }
    }
    .card-1 { animation: float1 4s ease-in-out infinite; }
    .card-2 { animation: float2 4s ease-in-out infinite 1s; }
    .card-3 { animation: float3 4s ease-in-out infinite 2s; }
    .card-4 { animation: float4 4s ease-in-out infinite 3s; }

    .kpi-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
    .kpi-value { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 25px; font-weight: 700; }
    .kpi-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #c9d1d9; font-weight: 500; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(5, 5)"><g class="card-1">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent1)" stroke-width="1.6"/>
    <text x="16" y="32" class="kpi-title">TerminalBench</text>
    <text x="16" y="70" class="kpi-value" fill="#00f2fe">L3 &amp; L4</text>
    <text x="16" y="96" class="kpi-sub">Engineering Contributor</text>
    <circle cx="21" cy="116" r="3.5" fill="#38d39f">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="120" fill="#38d39f" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600">Deterministic QC</text>
  </g></g>

  <!-- Card 2 -->
  <g transform="translate(217, 5)"><g class="card-2">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent2)" stroke-width="1.6"/>
    <text x="16" y="32" class="kpi-title">Red-Team Precision</text>
    <text x="16" y="70" class="kpi-value" fill="#ff5858">100%</text>
    <text x="16" y="96" class="kpi-sub">Stumped Frontier LLMs</text>
    <circle cx="21" cy="116" r="3.5" fill="#f857a6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <text x="32" y="120" fill="#f857a6" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600">20+ Golden Rubrics</text>
  </g></g>

  <!-- Card 3 -->
  <g transform="translate(429, 5)"><g class="card-3">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent3)" stroke-width="1.6"/>
    <text x="16" y="32" class="kpi-title">BigQuery Optimization</text>
    <text x="16" y="70" class="kpi-value" fill="#43e97b">-35%</text>
    <text x="16" y="96" class="kpi-sub">Looker &amp; PLX Latency</text>
    <circle cx="21" cy="116" r="3.5" fill="#38f9d7">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <text x="32" y="120" fill="#38f9d7" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600">CSCD Mart Cluster</text>
  </g></g>

  <!-- Card 4 -->
  <g transform="translate(641, 5)"><g class="card-4">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent4)" stroke-width="1.6"/>
    <text x="16" y="32" class="kpi-title">Data Lineage &amp; MDM</text>
    <text x="16" y="70" class="kpi-value" fill="#fee140">90K+</text>
    <text x="16" y="96" class="kpi-sub">Global Cloud Records</text>
    <circle cx="21" cy="116" r="3.5" fill="#fee140">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <text x="32" y="120" fill="#fee140" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600">12K+ Deprecated/Yr</text>
  </g></g>
</svg>
